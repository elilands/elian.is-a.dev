<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .background { fill: #08080B; }
        .text { fill: #F7F4EF; }
      }
      @media (prefers-color-scheme: light) {
        .background { fill: #FAF8F4; }
        .text { fill: #1a1a1a; }
      }
    </style>
  </defs>
  <rect class="background" width="32" height="32"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="text" font-family="Arial, sans-serif" font-size="18" font-weight="bold">EM</text>
</svg>